<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Penilaian Siswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <div class="badge">TUGAS KELOMPOK 3</div>
            <h1>Program Penilaian Siswa</h1>
            <p>Operator, Percabangan, dan Perulangan</p>
        </header>

        <section class="card input-card">
            <h2>Input Data Siswa</h2>

            <div class="form">
                <div class="input-group">
                    <label for="nama">Nama Siswa</label>
                    <input type="text" id="nama" placeholder="Masukkan nama siswa">
                </div>

                <div class="input-group">
                    <label for="nilai">Nilai</label>
                    <input type="number" id="nilai" min="0" max="100" placeholder="0 - 100">
                </div>

                <button onclick="tambahSiswa()">+ Tambah Siswa</button>
            </div>

            <p id="pesan"></p>
        </section>

        <section class="card">
            <div class="section-title">
                <h2>Daftar Penilaian</h2>
                <button class="danger" onclick="hapusSemua()">Hapus Semua</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama</th>
                            <th>Nilai</th>
                            <th>Kategori</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="tabelSiswa">
                        <tr>
                            <td colspan="5" class="empty">
                                Belum ada data siswa
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="stats">

    <div class="stat-card">
        <p>Nilai Tertinggi</p>
        <h3 id="tertinggi">-</h3>
    </div>

    <div class="stat-card">
        <p>Nilai Terendah</p>
        <h3 id="terendah">-</h3>
    </div>

    <div class="stat-card">
        <p>Rata-rata</p>
        <h3 id="rataRata">-</h3>
    </div>

    <div class="stat-card">
        <p>Jumlah Siswa</p>
        <h3 id="jumlahSiswa">0</h3>
    </div>

</section>


    <script src="script.js"></script>
</body>
</html>
